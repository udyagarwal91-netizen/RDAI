name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build RDAI.exe
        run: pyinstaller --noconfirm rdai.spec

      - name: Smoke test - app starts and serves the page
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RDAI\RDAI.exe -PassThru -RedirectStandardOutput run.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8501/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Get-Content run.log, err.log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "RDAI.exe did not start" }
          if (-not (Test-Path dist\RDAI\data\rdai.db)) { throw "database was not created" }
          Remove-Item -Recurse -Force dist\RDAI\data

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item packaging\README_FIRST.txt dist\RDAI\
          Compress-Archive -Path dist\RDAI -DestinationPath RDAI-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RDAI-windows
          path: RDAI-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RDAI-windows.zip
