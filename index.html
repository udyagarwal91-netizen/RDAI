<title>Netlanding Rate Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#F7F5EF; --surface:#FFFFFF; --surface-2:#FBFAF6;
    --ink:#171A22; --ink-2:#4A4638; --muted:#6B6555;
    --navy:#16235C; --navy-soft:#E7EAF4;
    --amber:#E8A200; --amber-soft:#FDF2D6; --amber-line:#F0C765;
    --line:#E3DFD3; --line-2:#EFECE2;
    --live:#1F7A4D; --live-soft:#E3F2E9;
    --archive:#8A6A2F; --archive-soft:#F6EEDC;
    --danger:#A8321E;
    --shadow:0 1px 2px rgba(23,26,34,.06), 0 8px 24px -12px rgba(23,26,34,.18);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#12141A; --surface:#1A1D25; --surface-2:#20242D;
      --ink:#EDEBE4; --ink-2:#C6C2B4; --muted:#938D7C;
      --navy:#93A6E6; --navy-soft:#222941;
      --amber:#F5B429; --amber-soft:#332A14; --amber-line:#6B5520;
      --line:#2D313B; --line-2:#262A33;
      --live:#54B884; --live-soft:#17301F;
      --archive:#D9AE5C; --archive-soft:#2C2418;
      --danger:#E8836E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#12141A; --surface:#1A1D25; --surface-2:#20242D;
    --ink:#EDEBE4; --ink-2:#C6C2B4; --muted:#938D7C;
    --navy:#93A6E6; --navy-soft:#222941;
    --amber:#F5B429; --amber-soft:#332A14; --amber-line:#6B5520;
    --line:#2D313B; --line-2:#262A33;
    --live:#54B884; --live-soft:#17301F;
    --archive:#D9AE5C; --archive-soft:#2C2418;
    --danger:#E8836E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{
    height:100%; margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    overflow-y:auto; overscroll-behavior-y:contain;
  }
  h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
  button{font:inherit; color:inherit; cursor:pointer}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{padding:10px 16px 10px; display:flex; flex-direction:column; gap:8px}
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .wordmark{
    font-family:Archivo,sans-serif; font-weight:800; font-size:14px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--navy);
  }
  .wordmark span{color:var(--muted); font-weight:600}
  .iconbtn{
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    width:34px; height:34px; display:grid; place-items:center; color:var(--muted);
  }
  .iconbtn:active{background:var(--surface-2)}

  .listpicker{display:flex; gap:6px}
  .chip{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:10px;
    padding:7px 8px 8px; text-align:left; display:flex; flex-direction:column; gap:1px;
    transition:border-color .12s, background .12s;
  }
  .chip .ttl{font-family:Archivo,sans-serif; font-weight:700; font-size:14px; letter-spacing:-.01em}
  .chip .sub{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .chip[aria-pressed="true"]{border-color:var(--navy); background:var(--navy-soft)}
  .chip[aria-pressed="true"] .sub{color:var(--navy)}
  .chip[data-role="both"][aria-pressed="true"]{border-color:var(--amber); background:var(--amber-soft)}
  .chip[data-role="both"][aria-pressed="true"] .sub{color:var(--archive)}

  /* ---------- page ---------- */
  main{padding:14px 16px 0; max-width:640px; margin:0 auto}
  .pad-bottom{height:112px}

  .hint{
    display:flex; gap:9px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; color:var(--ink-2); font-size:13.5px;
  }
  .hint b{color:var(--ink); font-weight:600}
  .hint .k{
    display:inline-block; background:var(--surface-2); border:1px solid var(--line);
    border-radius:5px; padding:0 5px; font-size:12.5px; color:var(--ink);
  }

  /* ---------- answer card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card + .card{margin-top:12px}
  .card-head{padding:13px 15px 11px; border-bottom:1px solid var(--line-2)}
  .eyebrow{
    font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .badge{
    font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:2px 6px; border-radius:5px;
  }
  .badge.live{background:var(--live-soft); color:var(--live)}
  .badge.arch{background:var(--archive-soft); color:var(--archive)}
  .prodname{font-size:20px; font-weight:700; margin-top:5px; line-height:1.2}
  .prodsub{color:var(--muted); font-size:13px; margin-top:2px}

  .pricewrap{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:14px 15px 4px}
  .price{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:54px; line-height:.92;
    letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .price .cur{font-size:30px; color:var(--muted); font-weight:600; margin-right:1px}
  .pricemeta{display:flex; flex-direction:column; gap:1px; padding-bottom:3px}
  .pricemeta .sz{font-family:Archivo,sans-serif; font-weight:700; font-size:16px; color:var(--navy)}
  .pricemeta .cap{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}

  .sizerow{display:flex; gap:6px; overflow-x:auto; padding:10px 15px 13px; scrollbar-width:thin}
  .szbtn{
    flex:0 0 auto; min-width:62px; border:1px solid var(--line); background:var(--surface-2);
    border-radius:10px; padding:6px 9px 7px; text-align:center; display:flex; flex-direction:column; gap:2px;
  }
  .szbtn .l{font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--muted)}
  .szbtn .v{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
  .szbtn[aria-pressed="true"]{background:var(--navy); border-color:var(--navy)}
  .szbtn[aria-pressed="true"] .l{color:rgba(255,255,255,.72)}
  .szbtn[aria-pressed="true"] .v{color:#fff}
  :root[data-theme="dark"] .szbtn[aria-pressed="true"] .v,
  :root[data-theme="dark"] .szbtn[aria-pressed="true"] .l{color:#12141A}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .szbtn[aria-pressed="true"] .v{color:#12141A}
    :root:not([data-theme="light"]) .szbtn[aria-pressed="true"] .l{color:rgba(18,20,26,.7)}
  }
  .szbtn.na{opacity:.4}
  .szbtn.na .v{color:var(--muted)}

  .factrow{display:flex; border-top:1px solid var(--line-2)}
  .fact{flex:1; padding:10px 15px 11px; border-right:1px solid var(--line-2)}
  .fact:last-child{border-right:0}
  .fact .l{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .fact .v{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:18px; margin-top:2px; font-variant-numeric:tabular-nums}
  .fact.mrp{background:var(--amber-soft)}
  .fact.mrp .v{color:var(--archive)}

  .compare{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 15px; border-top:1px solid var(--line-2); background:var(--surface-2);
    font-size:13px; color:var(--ink-2);
  }
  .compare .d{display:flex; align-items:center; gap:7px}
  .delta{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px}
  .delta.up{color:var(--live)}
  .delta.down{color:var(--danger)}

  .flag{
    display:flex; gap:8px; padding:9px 15px; border-top:1px solid var(--line-2);
    background:var(--amber-soft); color:var(--archive); font-size:12.5px; line-height:1.4;
  }
  .flag b{font-weight:700}

  /* candidates */
  .pick{padding:6px 0 8px}
  .pickrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    background:none; border:0; border-top:1px solid var(--line-2); padding:11px 15px; text-align:left;
  }
  .pickrow:first-child{border-top:0}
  .pickrow:active{background:var(--surface-2)}
  .pickrow .nm{display:block; font-weight:600; font-size:14.5px}
  .pickrow .sb{display:block; font-size:11.5px; color:var(--muted); margin-top:1px}
  .pickrow .ar{color:var(--muted); font-size:17px}

  /* ---------- browse ---------- */
  .sechead{
    display:flex; align-items:center; gap:9px; margin:22px 0 9px;
    font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
  }
  .sechead::after{content:""; flex:1; height:1px; background:var(--line)}

  details.grp{background:var(--surface); border:1px solid var(--line); border-radius:11px; margin-bottom:7px; overflow:hidden}
  details.grp > summary{
    list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; font-family:Archivo,sans-serif; font-weight:700; font-size:14px;
  }
  details.grp > summary::-webkit-details-marker{display:none}
  details.grp > summary .cnt{font-size:11px; font-weight:600; color:var(--muted); font-family:"IBM Plex Sans",sans-serif}
  details.grp[open] > summary{border-bottom:1px solid var(--line-2); background:var(--surface-2)}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:100%}
  th,td{padding:7px 9px; text-align:right; white-space:nowrap; border-top:1px solid var(--line-2)}
  th{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700; border-top:0}
  td.nm,th.nm{text-align:left; white-space:normal; min-width:132px; font-weight:600}
  td.nm .vr{display:block; font-weight:400; font-size:11.5px; color:var(--muted)}
  td.p{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600}
  td.p.off{color:var(--muted); font-weight:400}
  td.mrp,th.mrp{background:var(--amber-soft); color:var(--archive); font-weight:700}
  tbody tr:active{background:var(--surface-2)}

  /* ---------- terms ---------- */
  .terms{font-size:12.5px; color:var(--ink-2); padding:0 14px 13px}
  .terms li{margin:3px 0}
  .terms ol{padding-left:18px; margin:6px 0}

  /* ---------- bottom bar ---------- */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb, var(--ground) 94%, transparent);
    backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);
  }
  .dock-inner{max-width:640px; margin:0 auto; display:flex; gap:9px; align-items:center}
  .ask{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px; font-size:15px; color:var(--ink); font-family:inherit;
  }
  .ask::placeholder{color:var(--muted)}
  .ask:focus{outline:2px solid var(--navy); outline-offset:1px}
  .mic{
    flex:0 0 auto; width:54px; height:48px; border-radius:12px; border:1px solid var(--navy);
    background:var(--navy); color:#fff; display:grid; place-items:center; position:relative;
  }
  :root[data-theme="dark"] .mic, :root[data-theme="dark"] .mic svg{color:#12141A}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mic{color:#12141A} }
  .mic svg{width:22px; height:22px}
  .mic[data-state="listening"]{background:var(--danger); border-color:var(--danger); color:#fff}
  .mic[data-state="listening"]::after{
    content:""; position:absolute; inset:-4px; border-radius:15px;
    border:2px solid var(--danger); animation:pulse 1.1s ease-out infinite;
  }
  @keyframes pulse{0%{opacity:.7; transform:scale(.97)} 100%{opacity:0; transform:scale(1.14)}}
  @media (prefers-reduced-motion:reduce){ .mic[data-state="listening"]::after{animation:none; opacity:.55} }
  .heard{
    max-width:640px; margin:0 auto 7px; font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; gap:7px; min-height:17px;
  }
  .heard b{color:var(--ink); font-weight:600}

  /* ---------- date prompt sheet ---------- */
  .sheet{position:fixed; inset:0; z-index:90; display:grid; place-items:end center}
  .sheet::before{content:""; position:absolute; inset:0; background:rgba(12,14,20,.45)}
  .sheetbox{
    position:relative; width:100%; max-width:640px; background:var(--surface);
    border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheetbox h2{font-size:19px}
  .sheetbox p{color:var(--muted); font-size:13.5px; margin:5px 0 14px}
  .bigopt{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--line); background:var(--surface-2); border-radius:13px;
    padding:14px 15px; margin-bottom:9px; text-align:left;
  }
  .bigopt .t{display:block; font-family:Archivo,sans-serif; font-weight:700; font-size:17px}
  .bigopt .s{display:block; font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:600; margin-top:2px}
  .bigopt .ar{color:var(--muted); font-size:17px; flex:0 0 auto}
  .bigopt:active{background:var(--navy-soft)}
  .sheetfoot{display:flex; align-items:center; gap:8px; margin-top:4px; font-size:13px; color:var(--muted)}
  .sheetfoot input{width:17px; height:17px; accent-color:var(--navy)}

  .settingrow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 14px; border-top:1px solid var(--line-2); font-size:13.5px;
  }
  .settingrow:first-of-type{border-top:0}
  .settingrow .d{display:block; font-size:11.5px; color:var(--muted); margin-top:1px}
  .sw{width:17px; height:17px; accent-color:var(--navy); flex:0 0 auto}

  footer{padding:18px 16px 4px; color:var(--muted); font-size:11.5px; text-align:center; line-height:1.6}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandrow">
      <div class="wordmark">Netlanding <span>/ Rate Finder</span></div>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.5a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="listpicker" role="group" aria-label="Which price list">
      <button class="chip" data-role="aug" id="chipAug" aria-pressed="false">
        <span class="ttl">20 Aug 2026</span><span class="sub">Current list</span>
      </button>
      <button class="chip" data-role="jun" id="chipJun" aria-pressed="false">
        <span class="ttl">01 Jun 2026</span><span class="sub">Previous list</span>
      </button>
      <button class="chip" data-role="both" id="chipBoth" aria-pressed="false">
        <span class="ttl">Both</span><span class="sub">Compare</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div id="answer"></div>

  <div class="sechead" id="browseHead">Full price list</div>
  <div id="browse"></div>

  <footer>
    Rates are read from the Skipper Garments Netlanding price lists supplied on this device.<br>
    Rates may change without prior notice — always confirm against the printed list before booking.
  </footer>
  <div class="pad-bottom"></div>
</main>

<div class="dock">
  <div class="heard" id="heard"></div>
  <div class="dock-inner">
    <input class="ask" id="ask" type="text" inputmode="search" autocomplete="off"
           placeholder="Gold White RN 90" aria-label="Ask for a price">
    <button class="mic" id="mic" data-state="idle" aria-label="Ask by voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    </button>
  </div>
</div>

<div id="sheetHost"></div>

<script>

   {n:"Skipper Women", s:"A", mrp:"MRP 80-90", rows:[
     ["Gold Dyed (I/E)","Penteez","Loose Box",[28,30,35,38,41,N],65,0,""],

     ["Gold Dyed (I/E)","Penteez","2 Pc Box",[30,32,37,40,43,N],67,0,""],
     ["Gold Print (I/E)","Penteez","2 Pc Box",[32,34,39,42,45,N],70,0,""],
     ["Gold Print","Bloomer","",[N,42,49,N,N,N],90,0,""]]},
   {n:"Skipper Kids", s:"K", mrp:"MRP 60-70", rows:[
     ["Gold White","RN","",[29,30,34,N],61,0,""],
     ["Gold Dyed","Bloomer","",[30,31,N,33],64,0,""],
     ["Gold Print","Bloomer","",[31,32,N,34],65,0,""]]},
   {n:"Loria Women", s:"A", mrp:"MRP 80-90", rows:[
     ["Loria Plain","Misty I/E","2 Pc Pack",[N,44,48,50,52,N],95,0,""],
     ["Loria Print","Penteez I/E","2 Pc Pack",[N,50,56,59,62,N],105,0,""],
     ["Loria Plain","Hippy O/E","2 Pc Pack",[N,49,54,56,58,N],102,0,""],
     ["Loria Print","Penteez O/E","2 Pc Pack",[N,53,58,61,64,N],110,0,""],

  "assorted":"assorted","asst":"assorted","assort":"assorted",
  "adjustment":"adjustment","adjust":"adjustment","misty":"misty","hippy":"hippy","hippie":"hippy",
  "skin":"skin","black":"black","bw":"bw",
  "semi":"semi","winter":"winter","basic":"basic","prime":"prime","power":"power",
  "colin96":"colin96","96":"colin96","c96":"colin96"
};

var LIST_WORDS = {
  aug:["august","aug","latest","current","20th","20-aug","augustlist","newlist"],
  /* NB: bare "01" is deliberately absent — it is a style code (Shorts 01, AFD 01, SN 01). */
  jun:["june","jun","old","previous","earlier","oldlist","june1","previouslist"]
};

var STOP = {"what":1,"whats":1,"is":1,"the":1,"of":1,"for":1,"price":1,"rate":1,"rates":1,"prices":1,
  "cost":1,"tell":1,"me":1,"give":1,"show":1,"a":1,"an":1,"in":1,"on":1,"size":1,"sizes":1,"please":1,
  "how":1,"much":1,"do":1,"does":1,"and":1,"per":1,"rupees":1,"rs":1,"list":1,"pricelist":1,"number":1,
  "cm":1,"inch":1,"inches":1,"to":1,"about":1};

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[₹]/g," rupees ")
    .replace(/[^a-z0-9\-\/ ]/g," ")
    .replace(/\s+/g," ").trim();
}
function tokenise(s){
  return norm(s).split(/[ \/]+/).filter(Boolean);
}
function canon(t){
  if(ALIAS[t]) return ALIAS[t];
  var stripped = t.replace(/-/g,"");
  if(ALIAS[stripped]) return ALIAS[stripped];
  return stripped || t;
}
function itemTokens(it){
  var raw = [it.group, it.name, it.variant, it.pack].join(" ");
  var out = {};
  tokenise(raw).forEach(function(t){
    var c = canon(t); if(c && !STOP[c]) out[c] = 1;
    if(t !== c && !STOP[t]) out[t] = 1;
  });
  return out;
}
ITEMS.forEach(function(it){ it.tok = itemTokens(it); });

function lev(a,b){
  if(a===b) return 0;
  var m=a.length, n=b.length;
  if(Math.abs(m-n)>1) return 2;
  var prev=[], cur=[], i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    for(j=0;j<=n;j++) prev[j]=cur[j];
  }
  return prev[n];
}

/* ---- size parsing ---- */
var SIZE_NUMS = {
  "45":"45-55","50":"45-55","55":"45-55","60":"60-70","65":"60-70","70":"60-70",
  "73":"73","75":"75","80":"80-90","85":"85","90":"80-90","95":"95-100","100":"95-100",
  "105":"105","110":"110","115":"110","120":"120"
};
var SIZE_WORDS = {
  "s":"S-M-L","small":"S-M-L","m":"M-L","medium":"M-L","l":"M-L","large":"M-L",
  "ml":"M-L","sml":"S-M-L","xl":"XL-2XL","xxl":"XL-2XL","2xl":"XL-2XL","xl2xl":"XL-2XL",
  "3xl":"3XL","xxxl":"3XL","4xl":"4XL","xxxxl":"4XL"
};
function extractSize(tokens){
  var found=null, raw=null, used={};
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    if(/^\d{2,3}-\d{2,3}$/.test(t)){ found=t; used[i]=1; continue; }
    if(/^\d{2,3}$/.test(t) && SIZE_NUMS[t]){
      /* "80 90" spoken as two tokens */
      if(i+1<tokens.length && /^\d{2,3}$/.test(tokens[i+1]) && SIZE_NUMS[tokens[i+1]]===SIZE_NUMS[t]){
        used[i+1]=1;
      }
      found=SIZE_NUMS[t]; raw=t; used[i]=1; continue;
    }
    var w=t.replace(/-/g,"");
    if(SIZE_WORDS[w]){ found=SIZE_WORDS[w]; used[i]=1; }
  }
  return {size:found, raw:raw, used:used};
}
function resolveSize(sizes, want, raw){
  if(!want) return -1;
  var i = sizes.indexOf(want);
  if(i>=0) return i;
  if(raw){ i = sizes.indexOf(raw); if(i>=0) return i; }
  /* 73 / 75 are the same top kids size across the two sheets */
  if(want==="73" && sizes.indexOf("75")>=0) return sizes.indexOf("75");
  if(want==="75" && sizes.indexOf("73")>=0) return sizes.indexOf("73");
  if(want==="85" && sizes.indexOf("80-90")>=0) return sizes.indexOf("80-90");
  if(want==="S-M-L" && sizes.indexOf("M-L")>=0) return sizes.indexOf("M-L");
  if(want==="M-L" && sizes.indexOf("S-M-L")>=0) return sizes.indexOf("S-M-L");
  return -1;
}

/* ---- scoring ---- */
function search(query, listId){
  var toks = tokenise(query);
  var sz = extractSize(toks);
  var listHint = null, qTok = [];
  toks.forEach(function(t,i){
    if(sz.used[i]) return;
    var c = canon(t);
    for(var k in LIST_WORDS){
      if(LIST_WORDS[k].indexOf(t)>=0 || LIST_WORDS[k].indexOf(c)>=0){ listHint=k; return; }
    }
    if(STOP[c] || STOP[t]) return;
    if(c.length>0) qTok.push(c);
  });

  /* "hi cut" / "colin sight" / "lite rib" arrive as two words */
  var qBi = [];
  for(var b=0;b<qTok.length-1;b++){ qBi.push(canon(qTok[b]+qTok[b+1])); }

  var pool = ITEMS.filter(function(it){ return it.list === (listHint || listId); });
  var results = [];
  pool.forEach(function(it){
    var score=0, hits=0;
    qTok.forEach(function(q){
      var best=0;
      for(var t in it.tok){
        if(t===q){ best=Math.max(best,3); continue; }
        if(q.length>=4 && (t.indexOf(q)===0 || q.indexOf(t)===0)) best=Math.max(best,2.0);
        /* a near-miss stays useful for misheard words but must never beat an exact hit
           on a rival row — Kitto/Fitto, Contra/Candy are one letter apart */
        if(q.length>=5 && t.length>=5 && lev(q,t)<=1) best=Math.max(best,1.4);
      }
      if(best>0) hits++;
      score+=best;
    });
    qBi.forEach(function(q){
      if(it.tok[q]){ score+=5; hits++; }   /* a full two-word style name is strong evidence */
    });
    /* two rows of the same style differ only by which sizes they cover —
       when a size was named, favour the row that actually carries a rate there */
    if(sz.size && hits>0){
      var si = resolveSize(it.sizes, sz.size, sz.raw);
      score += (si>=0 && it.prices[si]!=null) ? 0.9 : -0.9;
    }
    if(hits>0) results.push({it:it, score:score + hits*0.35, hits:hits});
  });
  results.sort(function(a,b){ return b.score-a.score || a.it.name.localeCompare(b.it.name); });

  var need = Math.max(1, Math.ceil(qTok.length*0.5));
  var strong = results.filter(function(r){ return r.hits>=need && r.score>=2.4; });
  return {
    query:query, tokens:qTok, size:sz.size, raw:sz.raw, listHint:listHint,
    results:(strong.length?strong:results).slice(0,8),
    top:(strong.length?strong:results)[0] || null
  };
}

/* twin of an item in the other list */
function twin(it){
  var other = it.list==="aug" ? "jun" : "aug";
  var cands = ITEMS.filter(function(o){
    return o.list===other && norm(o.name)===norm(it.name) && norm(o.variant)===norm(it.variant);
  });
  if(!cands.length) return null;
  var exact = cands.filter(function(o){ return norm(o.pack)===norm(it.pack); });
  return (exact.length?exact:cands)[0];
}

var S = {
  list:null,            /* "aug" | "jun" | "both" */
  askedThisSession:false,
  alwaysAsk:true,
  speak:true,
  speakAllSizes:true,
  current:null,         /* {item, sizeIdx} */
};
function load(){
  try{
    var raw = localStorage.getItem("nlrf.v1");
    if(raw){ var o=JSON.parse(raw);
      if(o.alwaysAsk!==undefined) S.alwaysAsk=!!o.alwaysAsk;
      if(o.speak!==undefined) S.speak=!!o.speak;
      if(o.speakAllSizes!==undefined) S.speakAllSizes=!!o.speakAllSizes;
      if(!S.alwaysAsk && o.list) S.list=o.list;
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem("nlrf.v1", JSON.stringify({
    alwaysAsk:S.alwaysAsk, speak:S.speak, speakAllSizes:S.speakAllSizes, list:S.list
  })); }catch(e){}
}
load();
if(!S.list) S.list = "aug";   /* a list is always shown; the first query still confirms it */

function listById(id){ for(var i=0;i<LISTS.length;i++) if(LISTS[i].id===id) return LISTS[i]; return null; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============================================================
   VOICE OUT
   ============================================================ */
var voice = null;
function pickVoice(){
  if(!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices()||[];
  voice = vs.filter(function(v){return /en[-_]IN/i.test(v.lang);})[0]
       || vs.filter(function(v){return /en[-_]GB/i.test(v.lang);})[0]
       || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!S.speak || !window.speechSynthesis || !text) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-IN";
    u.rate = 1.02; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   RENDER — answer
   ============================================================ */
var answerEl = document.getElementById("answer");

function priceOf(it, idx){ return (idx>=0 && idx<it.prices.length) ? it.prices[idx] : null; }

function sizeLadderSentence(it){
  var parts=[];
  it.sizes.forEach(function(s,i){
    var p=it.prices[i]; if(p==null) return;
    parts.push(s.replace("-"," to ")+", "+p);
  });
  return parts.join(". ");
}

function renderAnswer(item, sizeIdx, opts){
  opts = opts || {};
  S.current = {item:item, sizeIdx:sizeIdx};
  var L = listById(item.list);
  var other = twin(item);
  var p = priceOf(item, sizeIdx);
  var compareMode = (S.list==="both");

  var html = '<div class="card">';

  html += '<div class="card-head"><div class="eyebrow">'
        + '<span>'+esc(item.group)+'</span>'
        + '<span class="badge '+(item.list==="aug"?"live":"arch")+'">'+esc(L.short)+'</span>'
        + '</div>'
        + '<div class="prodname">'+esc(item.name)+'</div>'
        + '<div class="prodsub">'+esc([item.variant,item.pack].filter(Boolean).join(" · "))+'</div></div>';

  /* headline price */
  var szLabel, cap;
  if(sizeIdx>=0 && p!=null){ szLabel = "Size "+item.sizes[sizeIdx]; cap = "Net rate per piece"; }
  else if(sizeIdx>=0 && p==null){ szLabel = "Size "+item.sizes[sizeIdx]; cap = "Not offered in this size"; }
  else { szLabel = "Pick a size"; cap = "Net rate per piece"; }

  html += '<div class="pricewrap">'
        + '<div class="price">'+(p!=null ? '<span class="cur">₹</span>'+p : '<span class="cur">—</span>')+'</div>'
        + '<div class="pricemeta"><span class="sz">'+esc(szLabel)+'</span><span class="cap">'+esc(cap)+'</span></div>'
        + '</div>';

  /* size chips */
  html += '<div class="sizerow" role="group" aria-label="Sizes">';
  item.sizes.forEach(function(s,i){
    var v = item.prices[i];
    html += '<button class="szbtn'+(v==null?" na":"")+'" data-sz="'+i+'" aria-pressed="'+(i===sizeIdx)+'">'
          + '<span class="l">'+esc(s)+'</span><span class="v">'+(v==null?"—":v)+'</span></button>';
  });
  html += '</div>';

  /* facts */
  html += '<div class="factrow">';
  html += '<div class="fact mrp"><div class="l">'+esc(item.mrpLabel)+'</div><div class="v">₹'+item.mrp+'</div></div>';
  if(item.packOf) html += '<div class="fact"><div class="l">Pack of</div><div class="v">'+item.packOf+'</div></div>';
  html += '<div class="fact"><div class="l">Price list</div><div class="v" style="font-size:14px">'+esc(L.short)+'</div></div>';
  html += '</div>';

  /* the other list */
  if(other){
    var oi = resolveSize(other.sizes, sizeIdx>=0 ? item.sizes[sizeIdx] : null);
    var op = priceOf(other, oi);
    var OL = listById(other.list);
    if(op!=null && p!=null && op!==p){
      var d = p-op, up = d>0;
      html += '<div class="compare"><div class="d"><span>'+esc(OL.short)+'</span>'
            + '<strong class="num">₹'+op+'</strong></div>'
            + '<span class="delta '+(up?"up":"down")+'">'+(up?"▲ +":"▼ ")+d+' vs then</span></div>';
    } else if(op!=null && p!=null && op===p){
      html += '<div class="compare"><div class="d"><span>'+esc(OL.short)+'</span>'
            + '<strong class="num">₹'+op+'</strong></div><span style="color:var(--muted)">Unchanged</span></div>';
    } else if(compareMode || opts.forceCompare){
      html += '<div class="compare"><div class="d"><span>'+esc(OL.short)+'</span>'
            + '<strong class="num">'+(op==null?"—":"₹"+op)+'</strong></div>'
            + '<span style="color:var(--muted)">'+(op==null?"Not in that list":"")+'</span></div>';
    }
  } else {
    html += '<div class="compare"><span style="color:var(--muted)">Not listed in the '
          + (item.list==="aug" ? "01 Jun 2026" : "20 Aug 2026") + ' sheet</span></div>';
  }

  if(item.note){
    html += '<div class="flag"><span>⚑</span><span><b>Check this one.</b> '+esc(item.note)+'</span></div>';
  }

  html += '</div>';

  /* full twin card in compare mode */
  if(compareMode && other){
    var oi2 = resolveSize(other.sizes, sizeIdx>=0 ? item.sizes[sizeIdx] : null);
    html += renderMiniCard(other, oi2);
  }

  answerEl.innerHTML = html;

  answerEl.querySelectorAll(".szbtn[data-sz]").forEach(function(b){
    b.addEventListener("click", function(){
      var i = +b.getAttribute("data-sz");
      renderAnswer(item, i, {spoken:false});
      var v = item.prices[i];
      say(v==null ? item.name+", size "+item.sizes[i]+" is not available."
                  : item.name+", size "+item.sizes[i]+", "+v+" rupees.");
    });
  });

  if(opts.speakNow) speakAnswer(item, sizeIdx);
  answerEl.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function renderMiniCard(it, sizeIdx){
  var L = listById(it.list);
  var p = priceOf(it, sizeIdx);
  var h = '<div class="card"><div class="card-head"><div class="eyebrow"><span>'+esc(it.group)+'</span>'
        + '<span class="badge '+(it.list==="aug"?"live":"arch")+'">'+esc(L.short)+'</span></div>'
        + '<div class="prodname">'+esc(it.name)+'</div>'
        + '<div class="prodsub">'+esc([it.variant,it.pack].filter(Boolean).join(" · "))+'</div></div>';
  h += '<div class="pricewrap"><div class="price">'+(p!=null?'<span class="cur">₹</span>'+p:'<span class="cur">—</span>')
     + '</div><div class="pricemeta"><span class="sz">'+(sizeIdx>=0?"Size "+esc(it.sizes[sizeIdx]):"Pick a size")
     + '</span><span class="cap">Net rate per piece</span></div></div>';
  h += '<div class="sizerow">';
  it.sizes.forEach(function(s,i){
    var v=it.prices[i];
    h += '<div class="szbtn'+(v==null?" na":"")+'"'+(i===sizeIdx?' aria-pressed="true"':'')+'>'
       + '<span class="l">'+esc(s)+'</span><span class="v">'+(v==null?"—":v)+'</span></div>';
  });
  h += '</div>';
  h += '<div class="factrow"><div class="fact mrp"><div class="l">'+esc(it.mrpLabel)+'</div><div class="v">₹'+it.mrp+'</div></div>';
  if(it.packOf) h += '<div class="fact"><div class="l">Pack of</div><div class="v">'+it.packOf+'</div></div>';
  h += '<div class="fact"><div class="l">Price list</div><div class="v" style="font-size:14px">'+esc(L.short)+'</div></div></div>';
  if(it.note) h += '<div class="flag"><span>⚑</span><span><b>Check this one.</b> '+esc(it.note)+'</span></div>';
  h += '</div>';
  return h;
}

function speakAnswer(item, sizeIdx){
  var L = listById(item.list);
  var lead = item.name + (item.variant ? ", "+item.variant : "");
  if(sizeIdx>=0){
    var p = item.prices[sizeIdx];
    if(p==null){ say(lead+" is not made in size "+item.sizes[sizeIdx]+"."); return; }
    var msg = lead+", size "+item.sizes[sizeIdx].replace("-"," to ")+", "+p+" rupees.";
    var other = twin(item);
    if(other){
      var oi = resolveSize(other.sizes, item.sizes[sizeIdx]);
      var op = priceOf(other, oi);
      if(op!=null && op!==p) msg += " "+listById(other.list).short.replace(/(\d+) (\w+) (\d+)/,"$2")+" rate was "+op+".";
    }
    say(msg);
  } else if(S.speakAllSizes){
    say(lead+", "+L.short+". "+sizeLadderSentence(item)+" rupees.");
  } else {
    var i = item.prices.findIndex(function(v){return v!=null;});
    say(lead+", size "+item.sizes[i]+", "+item.prices[i]+" rupees. Say a size for the rest.");
  }
}

function renderPicker(res){
  /* price each candidate at the size that was asked for — when they all agree,
     the rate can be given straight away and the tap is only about the variant */
  var priced = res.results.map(function(r){
    var i = resolveSize(r.it.sizes, res.size, res.raw);
    return (i>=0) ? r.it.prices[i] : null;
  });
  var known = priced.filter(function(v){ return v!=null; });
  var allSame = res.size && known.length===priced.length && known.every(function(v){ return v===known[0]; });

  var head = allSame
    ? '<div class="prodname" style="font-size:17px">\u20b9'+known[0]+' \u2014 same rate for all '+res.results.length+'</div>'
      + '<div class="prodsub">Tap the exact one to see its full size ladder.</div>'
    : '<div class="prodname" style="font-size:17px">Which one?</div>'
      + '<div class="prodsub">These rates differ \u2014 pick the right style before you quote.</div>';

  var html = '<div class="card"><div class="card-head"><div class="eyebrow">'
           + res.results.length+' close matches'+(res.size?' \u00b7 size '+esc(res.size):'')+'</div>'
           + head + '</div><div class="pick">';
  res.results.forEach(function(r,i){
    var it = r.it, L = listById(it.list);
    var sub = [it.group, it.variant, it.pack].filter(Boolean).join(" \u00b7 ");
    var pv = priced[i];
    html += '<button class="pickrow" data-i="'+i+'"><span><span class="nm">'+esc(it.name)+'</span>'
          + '<span class="sb">'+esc(sub)+' \u00b7 '+esc(L.short)+'</span></span>'
          + '<span class="num" style="font-weight:700;font-size:16px">'
          + (pv==null?'<span style="color:var(--muted)">\u2014</span>':'\u20b9'+pv)
          + ' <span class="ar">\u203a</span></span></button>';
  });
  html += '</div></div>';
  answerEl.innerHTML = html;
  answerEl.querySelectorAll(".pickrow").forEach(function(b){
    b.addEventListener("click", function(){
      var it = res.results[+b.getAttribute("data-i")].it;
      renderAnswer(it, resolveSize(it.sizes, res.size, res.raw), {speakNow:true});
    });
  });
  say(allSame
    ? known[0]+" rupees, for all "+res.results.length+" of these. Tap one for the full size list."
    : "I found "+res.results.length+" close matches with different rates. Tap the right one.");
  answerEl.scrollIntoView({block:"nearest", behavior:"smooth"});
}

        + '<span class="cnt">'+esc(L.long)+'</span></summary><div class="terms"><ol>';
  L.terms.forEach(function(t){ html += '<li>'+esc(t)+'</li>'; });
  html += '</ol></div></details>';

  browseEl.innerHTML = html;

  browseEl.querySelectorAll("tbody tr").forEach(function(tr){
    tr.style.cursor="pointer";
    tr.addEventListener("click", function(){
      var g = L.groups[+tr.getAttribute("data-g")];
      var ri = +tr.getAttribute("data-r");
      var it = ITEMS.filter(function(x){ return x.list===L.id && x.group===g.n && x.rowIndex===ri; })[0];
      if(it){ renderAnswer(it, -1, {speakNow:true}); window.scrollTo({top:0, behavior:"smooth"}); }
    });
  });
}

/* ============================================================
   ASK
   ============================================================ */
function runQuery(q){
  q = String(q||"").trim();
  if(!q) return;
  showHeard(q);

  var pre = tokenise(q), forced = null;
  pre.forEach(function(t){
    for(var k in LIST_WORDS){ if(LIST_WORDS[k].indexOf(t)>=0) forced = k; }
  });

  if(!forced && S.alwaysAsk && !S.askedThisSession){ askWhichList(function(){ runQuery(q); }); return; }

  var base = forced || (S.list==="both" ? "aug" : S.list);
  var res = search(q, base);

  if(!res.top){ renderNothing(q); return; }
  /* Answer straight out when the winner is unambiguous: either a clear score gap,
     or it simply matched more of what was said than anything else did. */
  var clear = res.results.length===1 ||
              (res.results.length>1 && (res.results[0].score - res.results[1].score >= 1.6
                                        || res.results[0].hits > res.results[1].hits));
  if(clear){
    var it = res.top.it;
    renderAnswer(it, resolveSize(it.sizes, res.size, res.raw), {speakNow:true, forceCompare:!!forced});
  } else {
    renderPicker(res);
  }
}

var heardEl = document.getElementById("heard");
function showHeard(txt, live){
  heardEl.innerHTML = txt ? (live?'<span>Listening…</span> ':'<span>Heard:</span> ')+'<b>'+esc(txt)+'</b>' : "";
}

var askEl = document.getElementById("ask");
askEl.addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); runQuery(askEl.value); askEl.blur(); }
});

/* ============================================================
   VOICE IN
   ============================================================ */
var micEl = document.getElementById("mic");
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;

if(!SR){
  micEl.disabled = true;
  micEl.style.opacity = ".4";
  micEl.title = "This browser has no speech input — type instead";
  heardEl.innerHTML = '<span>Voice input is not available in this browser. Type the product instead — Chrome on Android supports voice.</span>';
} else {
  micEl.addEventListener("click", function(){
    if(listening){ try{ rec.stop(); }catch(e){} return; }
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    rec = new SR();
    rec.lang = "en-IN";
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 3;
    var finalText = "";

    rec.onstart = function(){ listening = true; micEl.setAttribute("data-state","listening"); showHeard("", true); };
    rec.onresult = function(e){
      var interim = "";
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      showHeard(finalText || interim, !finalText);
    };
    rec.onerror = function(e){
      listening=false; micEl.setAttribute("data-state","idle");
      var m = e.error==="not-allowed" ? "Microphone blocked. Allow mic access for this page in your browser settings."
            : e.error==="no-speech" ? "I didn't catch that — tap the mic and speak again."
            : e.error==="network" ? "Voice needs a network connection. Type the product instead."
            : "Voice input stopped. Tap the mic to retry.";
      heardEl.innerHTML = '<span>'+esc(m)+'</span>';
    };
    rec.onend = function(){
      listening=false; micEl.setAttribute("data-state","idle");
      if(finalText.trim()) runQuery(finalText.trim());
    };
    try{ rec.start(); }catch(e){}
  });
}
