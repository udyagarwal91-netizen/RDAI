{#- Shared look for every template. Colours, fonts and logo come from the brand's settings —
    never edit them here. A brand can override any template by putting a file with the same
    name in brands/<brand>/templates/. -#}
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family={{ fonts.heading|replace(' ', '+') }}:wght@600;800&family={{ fonts.body|replace(' ', '+') }}:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --primary: {{ c.primary }}; --secondary: {{ c.secondary }}; --accent: {{ c.accent }};
          --dark: {{ c.text_dark }}; --light: {{ c.text_light }}; --backdrop: {{ backdrop }}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{ width }}px; height: {{ height }}px; overflow: hidden; }
  body { background: var(--secondary); color: var(--dark); font-family: '{{ fonts.body }}', system-ui, sans-serif;
         display: flex; flex-direction: column; padding: 64px; }
  h1, h2, .heading { font-family: '{{ fonts.heading }}', system-ui, sans-serif; letter-spacing: -0.02em; }
  .top { display: flex; justify-content: space-between; align-items: center; height: 72px; }
  .logo img { max-height: 64px; max-width: 320px; }
  .logo span { font-family: '{{ fonts.heading }}', sans-serif; font-weight: 800; font-size: 36px; color: var(--primary); }
  .badge { background: var(--primary); color: var(--light); font-weight: 600; font-size: 26px;
           padding: 10px 22px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--backdrop); border-radius: 36px; box-shadow: 0 18px 50px rgba(0,0,0,.10);
          display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .price { display: inline-flex; align-items: baseline; gap: 18px; background: var(--accent); color: var(--light);
           padding: 14px 30px; border-radius: 18px; font-weight: 800; font-size: 52px;
           font-family: '{{ fonts.heading }}', sans-serif; }
  .price { white-space: nowrap; flex-shrink: 0; }
  .price s { font-size: 30px; font-weight: 600; opacity: .8; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center;
          font-size: 26px; color: var(--primary); font-weight: 600; }
  {% block style %}{% endblock %}
</style></head>
<body>{% block body %}{% endblock %}</body></html>
