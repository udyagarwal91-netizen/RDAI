{% extends "base.html" %}
{% block title %}Create password{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Welcome 👋</h1>
  <p class="muted">Create a password for this Settings page. You'll use it every time you open it.
     Write it down somewhere safe.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Password (at least 8 characters)
      <input type="password" name="password" autocomplete="new-password" required autofocus></label>
    <label>Type it again
      <input type="password" name="confirm" autocomplete="new-password" required></label>
    <p><button type="submit">Create password</button></p>
  </form>
</div>
{% endblock %}
